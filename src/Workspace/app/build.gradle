apply plugin: 'com.android.application'
android {
    namespace "com.android.vending.helper"
    compileSdk 33
    defaultConfig { applicationId "com.android.vending.helper"; minSdk 24; targetSdk 28; versionCode 1; versionName "1.0" }
    buildTypes { 
        release { 
            minifyEnabled true 
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        } 
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { checkReleaseBuilds false; abortOnError false }
}
dependencies { implementation 'androidx.core:core:1.10.1'; implementation 'org.json:json:20231013' }
